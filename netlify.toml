[build]
  publish = "."
  functions = "netlify/functions"
[[redirects]]
  from = "/watch/:id"
  to = "/.netlify/functions/watch?id=:id"
  status = 200
  force = true
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
